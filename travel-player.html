 function yourTurn(){frame(T.yourTurn,'red',hint,prev?I.rot+T.hear:'',prev?()=>doHear():null,I.mic,'c-black',speak,I.arrow+T.skip,adv);}
 function speak(){recBegin(L.en,score);frame(T.listening,'red',hint,'',null,I.stop,'c-red',submit,'',null);}
 function submit(){frame(T.checking,'gry',hint,'',null,'<span class="spin"></span>','c-busy',()=>{},'',null);recSubmit();}
 function score(s){const colored=colorWords(L.en);if(s>=PASS){chime();frame(T.gotit,'grn','<div class="sent">'+colored+'</div>','',null,I.check,'c-green',()=>{},'',null);setTimeout(adv,1100);}else{tries++;if(tries>=MAXTRY){frame(T.effort,'amb','<div class="sent">'+colored+'</div>','',null,I.arrow,'c-black',adv,'',null);}else{frame(T.almost,'amb','<div class="sent">'+colored+'</div>','',null,I.mic,'c-black',speak,I.arrow+T.cont,adv);}}}
 listen();}
/* adapte */
function blankExcept(full,word){
 var low=full.toLowerCase(),wl=word.toLowerCase();
 var idx=low.indexOf(wl); if(idx<0)return full;
 var pre=full.slice(0,idx),mid=full.slice(idx,idx+word.length),post=full.slice(idx+word.length);
 var W=/[A-Za-zÀ-ÿ'']+(\s+[A-Za-zÀ-ÿ'']+)*/g;
 pre=pre.replace(W,'________'); post=post.replace(W,'________');
 return pre+'<span class="hit" style="text-decoration:underline">'+mid+'</span>'+post;
}
function rAdapt(A,i){st.tag=T.tagAdapt+' · '+(i+1)+'/'+SCN.adapt.length;
 const last=(i===SCN.adapt.length-1);
 const body='<div style="font-size:10px;font-weight:700;letter-spacing:.14em;color:#9a9a96;margin-bottom:6px">ADAPTE A FRASE À NOVA PALAVRA</div>'+(last?'':'<div class="sent" style="color:#9a9a96;font-size:15px">'+A.base+'</div>')+
  '<div class="sent" style="margin-top:10px">'+blankExcept(A.full,A.word)+'</div>';
 function speak(){recBegin(A.full,score);frame(T.listening,'red',body,'',null,I.stop,'c-red',submit,'',null);}
 function submit(){frame(T.checking,'gry',body,'',null,'<span class="spin"></span>','c-busy',()=>{},'',null);recSubmit();}
 function score(s){const colored=colorWords(A.full);if(s>=PASS){chime();frame(T.gotit,'grn','<div class="sent">'+colored+'</div>','',null,I.check,'c-green',()=>{},'',null);setTimeout(adv,1100);}else{tries++;if(tries>=MAXTRY){frame(T.effort,'amb','<div class="sent">'+A.full+'</div>','',null,I.arrow,'c-black',adv,'',null);}else{frame(T.almost,'amb','<div class="sent">'+colored+'</div>','',null,I.mic,'c-black',speak,I.arrow+T.cont,adv);}}}
 frame(T.yourTurn,'red',body,'',null,I.mic,'c-black',speak,I.arrow+T.skip,adv);}
/* done */
function rDone(){markPraticada();post('scene-complete',SCN.n);
 showSheet(false);showCover(false);tag('');
 hero.className='hero-ov show atcenter green';
 hero.innerHTML='<div class="hbody"><div class="hero-check">'+I.check+'</div><div class="hero-title">Well done!</div><div class="hero-sub">'+SCN.title+' · praticada</div><button class="hero-btn" id="hgo">Continuar →</button></div>';
 $('hgo').onclick=()=>{post('close');};}
/* ── revisão do dia ── */
function revItems(){var s=S(),t=today();return s.items.filter(it=>it.due<=t).sort((a,b)=>a.due<b.due?-1:1).slice(0,8);}
function runReview(){var items=revItems();var INT=[1,3,7,16];var i=0;
 if(!items.length){hero.className='hero-ov show atcenter cream';hero.innerHTML='<div class="hbody"><div class="hero-title">Nada para revisar hoje</div><div class="hero-sub">Volte amanhã.</div><button class="hero-btn" id="hgo">Voltar</button></div>';$('hgo').onclick=()=>post('close');return;}
 function grade(it,ok){var s=S();var live=s.items.filter(x=>x.id===it.id)[0];if(live){if(ok){live.box=Math.min(live.box+1,3);live.due=addDays(INT[live.box]);if(live.type==='rev'){var p=P();var r=p[live.scene];if(r&&r.prat){r.dom=r.dom||[];var t=today();if(t!==r.prat&&r.dom.indexOf(t)<0){r.dom.push(t);saveP(p);}}}}else{live.box=0;live.due=addDays(1);}saveS(s);}}
 function next(){killRec();i++;if(i>=items.length){var s=S();s.lastSession=today();saveS(s);
   showSheet(false);showCover(false);tag('');hero.className='hero-ov show atcenter green';hero.innerHTML='<div class="hbody"><div class="hero-check">'+I.check+'</div><div class="hero-title">Well done!</div><div class="hero-sub">Volte amanhã — é assim que as frases ficam para sempre.</div><button class="hero-btn" id="hgo">Continuar →</button></div>';$('hgo').onclick=()=>post('close');return;}
   item();}
 function item(){setRevProg();var it=items[i];st={tag:T.tagRev+' · '+(i+1)+'/'+items.length};tries=0;
  if(it.type==='rev'){const en=it.payload.en,body='<div class="ctx">Fale em inglês:</div><div class="sent" style="font-size:17px">'+it.payload.pt+'</div>';
   function speak(){recBegin(en,score);frame(T.listening,'red',body,'',null,I.stop,'c-red',submit,'',null);}
   function submit(){frame(T.checking,'gry',body,'',null,'<span class="spin"></span>','c-busy',()=>{},'',null);recSubmit();}
   function score(s){const colored=colorWords(en);if(s>=PASS){chime();grade(it,true);frame(T.gotit,'grn','<div class="sent">'+colored+'</div>','',null,I.check,'c-green',()=>{},'',null);setTimeout(next,1000);}else{tries++;if(tries>=2){buzz();grade(it,false);frame(T.effort,'amb','<div class="sent">'+en+'</div>','',null,I.arrow,'c-black',next,'',null);}else{frame(T.almost,'amb','<div class="sent">'+colored+'</div>','',null,I.mic,'c-black',speak,'',null);}}}
   frame(T.yourTurn,'red',body,'',null,I.mic,'c-black',speak,'',null);return;}
  if(it.type==='num'){mc(it.payload.q,'',it.payload.opts.slice(),it.payload.opts[it.payload.a],ok=>{});return mcG(it.payload.q,'',it.payload.opts,it.payload.a,it);}
  if(it.type==='chunk'){var ch=it.payload.chunk;var aIdx=it.payload.opts.indexOf(ch[0]);return mcG('Como se diz: “'+ch[1]+'”?','',it.payload.opts,aIdx,it);}
  if(it.type==='react'){var pl=it.payload;
   const body='<div style="font-size:10px;font-weight:700;letter-spacing:.14em;color:#9a9a96;margin-bottom:6px">OUÇA E RESPONDA EM INGLÊS</div>';
   function speak(){recBegin(pl.answers,score);frame(T.listening,'red',body,'',null,I.stop,'c-red',submit,'',null);}
   function submit(){frame(T.checking,'gry',body,'',null,'<span class="spin"></span>','c-busy',()=>{},'',null);recSubmit();}
   function score(s){var ok=(s>=55);grade(it,ok);
     frame(ok?T.gotit:T.effort,ok?'grn':'amb','<div style="font-size:12px;color:#9a9a96">Uma resposta possível:</div><div class="sent">'+pl.answers[0]+'</div>','',null,ok?I.check:I.arrow,ok?'c-green':'c-black',ok?()=>{}:next,'',null);
     if(ok)setTimeout(next,1400);}
   frame(T.yourTurn,'red',body,I.rot+T.hear,()=>playSeg(pl.file,pl,null),I.mic,'c-black',speak,'',null);
   playSeg(pl.file,pl,null);return;}
  if(it.type==='who'){var pl=it.payload;showSheet(true);showCover(false);
   sheet.innerHTML='<div class="slabel blk">Quem disse?</div><div class="card"><div class="ctx" style="text-align:center"><button class="opt" id="rp" style="display:inline-block;width:auto;padding:10px 22px">ouvir de novo</button></div><div id="opts"></div></div>';tag(st.tag);
   var opts=[pl.staff_pt,'Viajante'],correct=pl.who==='staff'?pl.staff_pt:'Viajante',done=false;
   $('rp').onclick=()=>playSeg(pl.file,pl,null);
   shuffle(opts).forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o;b.onclick=()=>{if(done)return;done=true;var ok=(o===correct);if(ok){b.classList.add('correct');chime();}else{b.classList.add('wrong');buzz();}grade(it,ok);setTimeout(next,900);};$('opts').appendChild(b);});
   playSeg(pl.file,pl,null);return;}}
 function mcG(q,sub,opts,aIdx,it){showSheet(true);showCover(false);tag(st.tag);var done=false;
  sheet.innerHTML='<div class="slabel blk">'+q+'</div><div class="card">'+(sub||'')+'<div id="opts"></div></div>';
  shuffle(opts.slice()).forEach(o=>{const b=document.createElement('div');b.className='opt';b.textContent=o;b.onclick=()=>{if(done)return;done=true;var ok=(o===opts[aIdx]);if(ok){b.classList.add('correct');chime();}else{b.classList.add('wrong');buzz();}grade(it,ok);setTimeout(next,900);};$('opts').appendChild(b);});}
 function setRevProg(){$('fill').style.width=Math.round(i/items.length*100)+'%';}
 item();}
/* ── boot ── */
document.querySelectorAll('.mpick').forEach(x=>x.style.display='none');
bindClose();post('ready');
if(REV){showCover(false);showSheet(false);runReview();}
else{buildSteps();si=0;
 hero.className='hero-ov show atcenter cream';
 hero.innerHTML='<div class="hbody"><div class="hero-eye">Situações de Viagem · '+String(SCN.n).padStart(2,'0')+'</div><div class="hero-title">'+SCN.title+'</div><div class="hero-sub">Assista, repita linha por linha e domine a situação.</div><button class="hero-btn" id="hgo">Começar →</button></div>';
 $('hgo').onclick=()=>{hero.className='hero-ov';render();};
 ensure(SCN.file,()=>{});}

</script></body></html>
