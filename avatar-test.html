<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emma — Avatar Test</title>
<link rel="preconnect" href="https://billowing-sunset-c961.lucaswassup.workers.dev" crossorigin>
<link rel="preconnect" href="https://api.simli.ai" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<script>
// The session can't be minted until the student picks a coach (the faceId
// depends on it). The SDK still loads during the picker, so nothing is lost:
// by the time they tap, only the Worker round-trip remains.
window._startMint = function(coachId){
  window._simliSessionPromise =
    fetch('https://billowing-sunset-c961.lucaswassup.workers.dev/simli-session?avatar=' + encodeURIComponent(coachId))
      .then(function(r){ return r.json(); })
      .catch(function(e){ return { error: String(e && e.message || e) }; });
  return window._simliSessionPromise;
};
</script>
<script src="js/avatar-simli-sdk.js?v=1" defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{background:#F3F0E8;}   /* same as the app (home2.html) */
  body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#23201A;
    -webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  .wrap{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
    overflow:hidden;
    padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));}
  /* Embedded in the app's avatar layer: the frame already excludes the tab bar
     and the safe area, so fill it exactly instead of measuring the viewport. */
  body.embedded .wrap{height:100%;padding:10px 16px 12px;}
  body.embedded .picker{padding:18px 16px;}
  .top,.hero,.status,.dbg,.bar{flex:none;}

  .top{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:2px 4px 10px;}
  .logo{grid-column:2;display:flex;justify-content:center;}
  .logo img{height:24px;width:auto;display:block;}

  /* hero: the Simli avatar stream */
  .hero{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:1/1.02;
    background:#FAF9F6;box-shadow:0 8px 24px rgba(60,50,20,.10);}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    background:#F1EFEA;}
  .hero .fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;color:#B8AF9C;font-weight:700;font-size:15px;
    background:radial-gradient(circle at 50% 35%, #FBF7EC 0%, #F1EBDD 100%);}
  .hero .fallback .mono{width:84px;height:84px;border-radius:50%;background:#F0B428;color:#2E2606;
    display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;}
  /* ── Connecting loader — ported 1:1 from Lucas's Claude Design export
     ("Emma Connecting Loader Final", variant 1d: arc spinner + status pill) */
  .loadwrap{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:26px;background:#FAF9F6;
    font-family:'Nunito',system-ui,sans-serif;transition:opacity .6s ease;}
  .loadwrap.on{display:flex;}
  .loadwrap.fade{opacity:0;pointer-events:none;}
  .loadwrap .ldspin{animation:ldspin 1.1s linear infinite;display:block;}
  @keyframes ldspin{to{transform:rotate(360deg);}}
  .loadwrap .ldtxt{display:flex;flex-direction:column;align-items:center;gap:12px;}
  .loadwrap .ldh{font-size:19px;font-weight:700;color:#2b2a26;}
  .loadwrap .ldpill{display:flex;align-items:center;gap:8px;background:#faf7ec;
    border:1px solid rgba(0,0,0,.06);border-radius:999px;padding:7px 16px;
    box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .loadwrap .lddot{width:8px;height:8px;border-radius:50%;background:#e8b73a;
    animation:ldpulse 1.4s ease-in-out infinite;}
  @keyframes ldpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.12);opacity:1}}
  .loadwrap .lds{font-size:13px;font-weight:700;color:#8a8168;}

  /* ── Coach picker ─────────────────────────────────────────────────────────
     Shown on entry and again after a session ends. Nothing is minted until a
     coach is chosen, so browsing is free — and the tap doubles as the gesture
     iOS needs before it will play any sound. */
  .picker{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:#F3F0E8;display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));}
  .picker.on{display:flex;}
  .picker .plogo{margin-bottom:20px;}
  .picker .plogo img{height:24.72px;display:block;}   /* 22px +5% then +7% */
  .pcard{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:18px 16px 16px;
    box-shadow:0 6px 20px rgba(60,50,20,.08);}
  .pcard h2{font-size:19px;font-weight:800;text-align:center;margin-bottom:3px;color:#23201A;}
  .pcard .psub{font-size:12.5px;font-weight:600;color:#8A8271;text-align:center;margin-bottom:16px;}
  .prow{display:flex;align-items:center;gap:13px;padding:11px;border-radius:18px;
    border:1.5px solid #EFEAD9;margin-bottom:9px;background:#fff;width:100%;
    font-family:inherit;text-align:left;cursor:pointer;transition:border-color .15s, background .15s;}
  .prow.sel{border-color:#E6B31E;background:#FDFAF0;}
  .prow .pav{width:56px;height:56px;border-radius:50%;flex:none;background-size:cover;
    background-position:center;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;color:#fff;}
  .prow b{font-size:17px;font-weight:800;color:#23201A;display:block;}
  .prow .pchk{margin-left:auto;width:22px;height:22px;border-radius:50%;background:#E6B31E;
    display:none;align-items:center;justify-content:center;}
  .prow.sel .pchk{display:flex;}
  .prow .pchk svg{width:13px;height:13px;color:#2E2606;}
  .pgo{margin-top:12px;width:100%;background:#1A1A1C;color:#fff;border:0;border-radius:999px;
    padding:15px;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;}
  .pgo:active{transform:scale(.99);}
  .pend{font-size:13px;font-weight:700;color:#8A8271;text-align:center;margin-bottom:14px;
    display:none;}
  .pend.on{display:block;}

  .live{position:absolute;top:14px;right:14px;background:#FBF7EC;border-radius:999px;
    padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;
    color:#3A362C;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2;}
  .live i{width:9px;height:9px;border-radius:50%;background:#C9C2B2;display:block;}
  .live.on i{background:#2FA85C;}

  .msgs{flex:1;padding:16px 2px 10px;display:flex;flex-direction:column;gap:12px;
    overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  .bub{max-width:78%;padding:13px 17px;font-size:16px;line-height:1.4;font-weight:600;}
  .bub.emma{background:#FFFFFF;border-radius:22px 22px 22px 6px;color:#26231C;
    box-shadow:0 1px 3px rgba(60,50,20,.06);align-self:flex-start;}
  .bub.me{background:#F4E4B7;border-radius:22px 22px 6px 22px;color:#3B3320;align-self:flex-end;}

  .status{text-align:center;font-size:13px;color:#9B9484;font-weight:600;min-height:20px;
    padding:0 8px 8px;}
  /* iOS won't play sound until the page has been touched. Rather than a line of
     warning text, this is an invitation sitting on her video: frosted pill,
     speaker glyph, one gold ripple. */
  .tapwrap{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;
    display:none;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;
    background:rgba(255,253,247,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 6px 20px rgba(40,35,20,.18);white-space:nowrap;}
  .tapwrap.on{display:flex;}
  .tapwrap .rip{position:absolute;inset:0;border-radius:999px;
    border:2px solid rgba(230,179,30,.5);animation:tapRip 1.9s ease-out infinite;}
  @keyframes tapRip{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.13);opacity:0}}
  .tapwrap svg{width:22px;height:22px;color:#B8891C;flex:none;}
  .tapwrap b{font-size:15px;font-weight:800;color:#2B2620;}

  /* Suggested answers — chips in the conversation flow, on the student's side,
     so two long options have room to breathe instead of cramming the status
     line. Tapping one dismisses it (this is speaking practice: the student
     says it out loud, the chip doesn't send it for them). */
  .sugg{align-self:flex-end;display:flex;flex-direction:column;align-items:stretch;
    gap:8px;max-width:88%;}
  .sugg-lbl{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:#B0A891;text-align:right;padding-right:4px;}
  .sugg-chip{background:#FFFDF7;border:1.5px solid #EFDFAE;border-radius:18px;
    padding:11px 15px;font-family:inherit;font-size:15px;font-weight:600;line-height:1.35;
    color:#3B3320;text-align:left;cursor:pointer;transition:transform .12s, background .2s;
    box-shadow:0 1px 2px rgba(60,50,20,.05);}
  .sugg-chip:active{transform:scale(.985);background:#FBF4E2;}
  .dbg{text-align:center;font-size:11px;color:#C5BEAD;font-weight:600;padding-bottom:6px;}

  .bar{position:relative;background:#FFFFFF;border-radius:26px;padding:12px 16px;
    min-height:104px;box-shadow:0 6px 24px rgba(60,50,20,.10);}
  .actions{display:flex;align-items:center;justify-content:space-between;min-height:80px;}
  /* The mic is the visual anchor of the screen, so it sits on the true centre
     line regardless of how wide its neighbours are. (End is 18px wider than the
     "?" chip, which used to drag the mic 9px off axis.) The differing shapes are
     deliberate: End is the one irreversible control on the bar. */

  .chip{width:52px;height:52px;border-radius:50%;background:#FFFFFF;border:1.5px solid #EDE7D8;
    display:flex;align-items:center;justify-content:center;color:#6B655A;cursor:pointer;
    font-family:inherit;font-size:21px;font-weight:800;line-height:1;padding-bottom:3px;}
  .chip:disabled{opacity:.4;}
  .chip-end{width:auto;min-width:64px;padding:0 18px;border-radius:999px;font-size:15px;
    font-weight:700;color:#C2543A;border-color:#EBD9CE;padding-bottom:0;line-height:normal;}
  /* Mic — ported 1:1 from the module chat (conversation.css .emma-mic):
     flat solid gold circle, black glyph via mask, press-shrink, black stop
     square + breathing gold pulse while listening. */
  .mic{flex:0 0 auto;width:80px;height:80px;padding:0;border-radius:50%;font-size:0;
    background:#E6B31E;overflow:hidden;border:0;cursor:pointer;transition:transform .15s;
    /* Anchored to the bar's true centre line: End is wider than the "?" chip,
       which used to drag the mic 9px off axis. The differing shapes stay —
       End is the one irreversible control here and should look unlike its
       neighbour. */
    position:absolute;left:50%;transform:translateX(-50%);}
  .mic:active{transform:translateX(-50%) scale(.94);}

  .mic::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:32px;height:32px;background-color:#0a0a0a;
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3z'/><path d='M19 11a1 1 0 10-2 0 5 5 0 01-10 0 1 1 0 10-2 0 7 7 0 006 6.92V20H8a1 1 0 100 2h8a1 1 0 100-2h-3v-2.08A7 7 0 0019 11z'/></svg>") center/contain no-repeat;
    mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3z'/><path d='M19 11a1 1 0 10-2 0 5 5 0 01-10 0 1 1 0 10-2 0 7 7 0 006 6.92V20H8a1 1 0 100 2h8a1 1 0 100-2h-3v-2.08A7 7 0 0019 11z'/></svg>") center/contain no-repeat;}
  .mic.rec::after{display:none;}
  .mic.rec .stop-sq{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:22px;height:22px;background:#0a0a0a;border-radius:3px;}
  @keyframes emmaMicListenPulse{
    0%{box-shadow:0 0 0 0 rgba(230,179,30,.55);}
    70%{box-shadow:0 0 0 22px rgba(230,179,30,0);}
    100%{box-shadow:0 0 0 0 rgba(230,179,30,0);}}
  .mic.rec{animation:emmaMicListenPulse 1.6s ease-out infinite;}
</style>
</head>

  </div>
</div>

// Resolves when the video element has actually rendered a frame — the honest
// signal that there is a face on screen. Falls back to a poll where
// requestVideoFrameCallback is missing, and gives up after 4s so a stream that
// never paints can't strand the session on the loader.
function whenFirstFrame(v, cb){
  var done = false;
  function fire(){ if(done) return; done = true; cb(); }
  try{
    if(typeof v.requestVideoFrameCallback === 'function'){
      v.requestVideoFrameCallback(function(){ fire(); });
    }
  }catch(e){}
  var t0 = Date.now();
  var iv = setInterval(function(){
    if(done || sessionEnded){ clearInterval(iv); return; }
    var painted = v.videoWidth > 0 && v.currentTime > 0 && !v.paused;
    if(painted || Date.now() - t0 > 4000){ clearInterval(iv); fire(); }
  }, 80);
}

// ── Simli connection ────────────────────────────────────────────────────────
var simli = null;          // SimliClient instance, or null in fallback mode
var avatarMode = false;    // true once the stream is live
var sessionEnded = false;

async function loadSimliSDK(){
  // Primary: our self-hosted bundle (avatar-simli-sdk.js, compiled for
  // Safari 15 — the npm package's own build is broken by a Client/client
  // filename-case typo, which is why every CDN build failed to evaluate).
  if(window.SimliSDK && typeof window.SimliSDK.SimliClient === 'function'){
    return window.SimliSDK;
  }
  // Last resort: CDN module builds.
  var sources = [
    'https://cdn.jsdelivr.net/npm/simli-client/+esm',
    'https://esm.sh/simli-client?bundle',
    'https://esm.sh/simli-client'
  ];
  var lastErr = null;
  for(var i = 0; i < sources.length; i++){
    setDbg('avatar: importing SDK (' + (i + 1) + '/' + sources.length + ')…');
    try{
      var mod = await import(sources[i]);
      if(mod && (mod.SimliClient || (mod.default && mod.default.SimliClient))){
        return mod.SimliClient ? mod : mod.default;
      }
      lastErr = new Error('no SimliClient export');
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('all SDK sources failed');
}

async function connectAvatar(){
  try{
    var mod = await loadSimliSDK();
    var SimliClient = mod.SimliClient;
    var LogLevel = mod.LogLevel || {};
    setDbg('avatar: minting session…');
    var data = window._simliSessionPromise
      ? await window._simliSessionPromise
      : await (await fetch(W + '/simli-session')).json();
    if(!data.session_token) throw new Error(data.error || 'no session_token');
    setDbg('avatar: connecting stream…');
    simli = new SimliClient(
      data.session_token,
      $('simliVideo'),
      $('simliAudio'),
      null,                              // no ICE config needed for livekit
      (LogLevel.INFO !== undefined ? LogLevel.INFO : 1),
      'livekit'                          // Trinity avatars stream via livekit
    );
    simli.on && simli.on('start', function(){
      // 'start' means the session is connected — NOT that a frame has been
      // painted. Releasing here let the greeting (bubble + voice) land while
      // the card was still blank. Wait for an actual video frame instead.
      avatarMode = true;
      setDbg('avatar: connected, waiting for first frame');
      whenFirstFrame($('simliVideo'), function(){
        if(sessionEnded) return;
        $('livePill').classList.add('on');
        $('heroFallback').style.display = 'none';
        hideLoading(true); // crossfade: loader fades as her face appears
        setDbg('avatar: live');
        streamReady = true;
        if(audioUnlocked) maybeBegin(); else promptForTap();
      });
    });
    simli.on && simli.on('error', function(e){
      console.warn('[simli] error', e);
      if(!avatarMode) enterFallback('connect error');
    });
    simli.on && simli.on('startup_error', function(m){
      console.warn('[simli] startup_error', m);
      enterFallback('startup: ' + m);
    });
    await simli.start();
    // safety: if 'start' never fires, fall back
    setTimeout(function(){ if(!avatarMode && !sessionEnded) enterFallback('timeout'); }, 10000);
  }catch(e){
    console.warn('[simli] init failed', e);
    enterFallback(String(e && e.message || e));
  }
}

// ── Audio: decode Sarah's mp3 and feed the avatar (or play locally) ────────
var actx = null;
function getACtx(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume().catch(function(){});
  return actx;
}
// Linear-resample a Float32 mono buffer to 16 kHz Int16 bytes (Simli's format)
function toPCM16k(audioBuf){
  var src = audioBuf.getChannelData(0);
  var srcRate = audioBuf.sampleRate;
  var ratio = srcRate / 16000;
  var outLen = Math.floor(src.length / ratio);
  var out = new Int16Array(outLen);
  for(var i = 0; i < outLen; i++){
    var pos = i * ratio;
    var i0 = Math.floor(pos), i1 = Math.min(i0 + 1, src.length - 1);
    var frac = pos - i0;
    var s = src[i0] * (1 - frac) + src[i1] * frac;
    s = Math.max(-1, Math.min(1, s));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return new Uint8Array(out.buffer);
}

var speakId = 0;
var localSrc = null;
var turnTimer = null;

// Plays an already-decoded buffer — used by the prefetched greeting so Emma
// speaks the instant her face appears instead of waiting for two round-trips.
function playBuffer(buf){
  var turn = ++speakId;
  setStatus('Emma is speaking...');
  micBtn.disabled = false; micBtn.style.opacity = '1';
  var durMs = Math.ceil(buf.duration * 1000);
  if(avatarMode && simli){
    try{ simli.ClearBuffer && simli.ClearBuffer(); }catch(e){}
    var pcm = toPCM16k(buf);
    var CHUNK = 6000;
    for(var off = 0; off < pcm.length; off += CHUNK){
      simli.sendAudioData(pcm.subarray(off, Math.min(off + CHUNK, pcm.length)));
    }
  }else{
    var ctx = getACtx();
    var ready = (ctx.state === 'running') ? Promise.resolve() : ctx.resume();
    ready.then(function(){
      if(turn !== speakId || sessionEnded) return;
      localSrc = ctx.createBufferSource();
      localSrc.buffer = buf;
      localSrc.connect(ctx.destination);
      localSrc.start();
    }).catch(function(){});
  }
  clearTimeout(turnTimer);
  turnTimer = setTimeout(function(){
    if(turn !== speakId || sessionEnded) return;
    setStatus('Your turn — tap to speak');
    micBtn.disabled = false; micBtn.style.opacity = '1';
  }, durMs + 600);
}

// The greeting is generated AND voiced while the stream is still connecting.
// Nothing is shown or played until beginConversation() releases it, so the
// bubble still never precedes her face — the waiting just happens in parallel.
var greetingPrefetch = null;
function prefetchGreeting(){
  history = [{ role:'user', content:'[Start: greet the student and ask one simple question. 12 words maximum.]' }];
  greetingPrefetch = fetch(W + '/emma-chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ system: buildPrompt(coach), messages: history, topic: 'Conversation', max_tokens: 150 })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error || !d.text) throw new Error(d.error || 'no text');
    var text = d.text;
    return fetch(W + '/emma-speak', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: text, voice: coach.voice })
    })
    .then(function(r){ if(!r.ok) throw new Error('TTS ' + r.status); return r.arrayBuffer(); })
    .then(function(ab){ return getACtx().decodeAudioData(ab); })
    .then(function(buf){ return { text: text, buf: buf }; })
    .catch(function(){ return { text: text, buf: null }; }); // text still usable
  });
  return greetingPrefetch;
}

function emmaSpeak(text){
  var turn = ++speakId;
  setStatus('Emma is speaking...');
  micBtn.disabled = false; // allow interrupting by tapping mic
  fetch(W + '/emma-speak', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text: text, voice: coach.voice })
  })
  .then(function(r){ if(!r.ok) throw new Error('TTS ' + r.status); return r.arrayBuffer(); })
  .then(function(ab){ return getACtx().decodeAudioData(ab); })
  .then(function(buf){
    if(turn !== speakId || sessionEnded) return;
    var durMs = Math.ceil(buf.duration * 1000);
    if(avatarMode && simli){
      // stream to the avatar in ~6 KB chunks; Simli plays the synced audio
      try{ simli.ClearBuffer && simli.ClearBuffer(); }catch(e){}
      var pcm = toPCM16k(buf);
      var CHUNK = 6000;
      for(var off = 0; off < pcm.length; off += CHUNK){
        simli.sendAudioData(pcm.subarray(off, Math.min(off + CHUNK, pcm.length)));
      }
    }else{
      // fallback: play locally. iOS suspends the audio engine between turns;
      // resume it (and wait for the resume) before starting playback, or the
      // audio silently doesn't come out — the "sometimes no audio" bug.
      var ctx = getACtx();
      var ready = (ctx.state === 'running') ? Promise.resolve() : ctx.resume();
      ready.then(function(){
        if(turn !== speakId || sessionEnded) return;
        localSrc = ctx.createBufferSource();
        localSrc.buffer = buf;
        localSrc.connect(ctx.destination);
        localSrc.start();
      }).catch(function(){});
    }
    clearTimeout(turnTimer);
    turnTimer = setTimeout(function(){
      if(turn !== speakId || sessionEnded) return;
      setStatus('Your turn — tap to speak');
      micBtn.disabled = false; micBtn.style.opacity = '1';
    }, durMs + 600);
  })
  .catch(function(e){
    console.warn('[tts]', e);
    if(turn !== speakId) return;
    setStatus('Your turn — tap to speak');
    micBtn.disabled = false; micBtn.style.opacity = '1';
  });
}
function stopSpeaking(){
  speakId++;
  clearTimeout(turnTimer);
  try{ if(localSrc){ localSrc.stop(); localSrc = null; } }catch(e){}
  try{ if(avatarMode && simli && simli.ClearBuffer) simli.ClearBuffer(); }catch(e){}
}

// ── Mic (with the app's silence gate) ──────────────────────────────────────
var rec = false, mr = null, chunks = [], recT0 = 0, recPeak = 1, recMeter = null, recCtx = null;
function supportedMime(){
  var t = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  for(var i = 0; i < t.length; i++) if(MediaRecorder.isTypeSupported(t[i])) return t[i];
  return '';
}
function startRec(){
  stopSpeaking(); // tapping mic while Emma talks = interrupt
  navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
    chunks = [];
    var mt = supportedMime();
    mr = new MediaRecorder(stream, mt ? { mimeType: mt } : {});
    mr.ondataavailable = function(e){ if(e.data && e.data.size > 0) chunks.push(e.data); };
    mr.onstop = onRecStop;
    mr.start(250); rec = true;
    recT0 = Date.now(); recPeak = 1;
    try{
      recCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(recCtx.state === 'suspended') recCtx.resume().catch(function(){});
      var src = recCtx.createMediaStreamSource(stream);
      var an = recCtx.createAnalyser(); an.fftSize = 1024; src.connect(an);
      var buf = new Float32Array(an.fftSize);
      recPeak = 0;
      recMeter = setInterval(function(){
        try{
          an.getFloatTimeDomainData(buf);
          var s = 0; for(var i = 0; i < buf.length; i++) s += buf[i] * buf[i];
          var rms = Math.sqrt(s / buf.length);
          if(rms > recPeak) recPeak = rms;
        }catch(e){ recPeak = 1; }
      }, 80);
    }catch(e){ recPeak = 1; }
    micBtn.classList.add('rec');
    micBtn.innerHTML = '<span class="stop-sq"></span>';
    setStatus('Listening... tap to stop');
  }).catch(function(e){ setStatus('Mic error: ' + e.message); });
}
function stopRec(){
  if(!mr || !rec) return;
  rec = false;
  micBtn.classList.remove('rec');
  micBtn.innerHTML = '';
  micBtn.disabled = true;
  micBtn.style.opacity = '0.5';
  setStatus('Transcribing...');
  mr.stop();
  try{ mr.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
}
function onRecStop(){
  try{ clearInterval(recMeter); }catch(e){}
  try{ if(recCtx){ recCtx.close(); recCtx = null; } }catch(e){}
  var ms = Date.now() - recT0;
  var mt = mr.mimeType || 'audio/webm';
  var blob = new Blob(chunks, { type: mt });
  if(blob.size < 1000 || ms < 500 || recPeak < 0.02){
    micBtn.disabled = false; micBtn.style.opacity = '1';
    setStatus('Could not hear you. Tap to try again.');
    return;
  }
  var reader = new FileReader();
  reader.onloadend = function(){
    var b64 = reader.result.split(',')[1];
    fetch(W + '/transcribe', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ audio: b64, mimeType: mt, skipPron: true, noEcho: true })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var t = (d.text || '').trim();
      if(!t){
        micBtn.disabled = false; micBtn.style.opacity = '1';
        setStatus('Could not hear you. Tap to try again.');
        return;
      }
      submit(t);
    })
    .catch(function(){
      micBtn.disabled = false; micBtn.style.opacity = '1';
      setStatus('Error. Tap to try again.');
    });
  };
  reader.readAsDataURL(blob);
}

function startSession(){
  hidePicker();
  // neutral card behind the stream: every coach now shows the background their
  // face was generated with, so nothing is repainted here
  document.querySelector('.hero').style.background = '#F1EFEA';
  $('simliVideo').style.background = '#F1EFEA';
  boot();
}

// ── Boot: the session opens itself; no tap needed ─────────────────────────
// The avatar starts connecting the moment the page loads. Emma's first line is
// held back by beginConversation() until the stream is live (or until the
// fallback is decided), so the greeting never arrives before her face.
var booted = false;
var convoStarted = false;
// Emma's first line is released only when BOTH are true: her stream (or the
// audio-only fallback) is ready, AND the browser will actually let us make
// sound. Otherwise the greeting plays into a muted output — lips moving, no
// voice — which is exactly what iOS does before the page has been touched.
var streamReady = false;
var audioUnlocked = false;
function maybeBegin(){
  if(streamReady && audioUnlocked) beginConversation();
}
function promptForTap(){
  if(convoStarted || sessionEnded) return;
  $('tapPrompt').classList.add('on');
}
function clearTapPrompt(){
  $('tapPrompt').classList.remove('on');
}
function beginConversation(){
  if(convoStarted || sessionEnded) return;
  convoStarted = true;
  micBtn.disabled = false;
  micBtn.style.opacity = '1';
  hintBtn.disabled = false;
  clearTimeout(limitTimer);
  limitTimer = setTimeout(function(){
    endSession('5 minutos completos — great job! Até amanhã.');
  }, LIMIT_MS);
  if(greetingPrefetch){
    greetingPrefetch.then(function(g){
      if(sessionEnded) return;
      history.push({ role:'assistant', content: g.text });
      addBubble('emma', g.text);
      if(g.buf) playBuffer(g.buf); else emmaSpeak(g.text);
    }).catch(function(){ startConvo(); });
  }else{
    startConvo();
  }
}
function boot(){
  if(booted) return; booted = true;
  showLoading();
  try{
    var c0 = getACtx();
    if(c0.state === 'running') audioUnlocked = true; // no gesture needed here
    else c0.resume().then(function(){ if(c0.state === 'running') markUnlocked(); }).catch(function(){});
  }catch(e){}
  $('simliAudio').play().catch(function(){});
  window._startMint(coach.id);  // faceId is chosen by the coach's id
  prefetchGreeting();           // greeting + voice ready before the stream is
  connectAvatar();
}
function enterLab(){
  try{
    if(new URLSearchParams(location.search).get('embed') === '1' || window.self !== window.top){
      document.body.classList.add('embedded');
    }
  }catch(e){ document.body.classList.add('embedded'); }
  var fromToday = null;
  try{ fromToday = new URLSearchParams(location.search).get('coach'); }catch(e){}
  var chosen = fromToday;
  if(!chosen){
    try{ chosen = localStorage.getItem(COACH_KEY); }catch(e){}
  }
  if(chosen){
    for(var i = 0; i < COACHES.length; i++) if(COACHES[i].id === chosen) coach = COACHES[i];
  }
  showPicker(null, !!fromToday);
  $('pickerGo').addEventListener('click', startSession);
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', enterLab);
}else{
  enterLab();
}
// iOS blocks audio until the page has been touched. If Safari suspended the
// engine, the first touch anywhere revives it — invisible when autoplay is
// allowed, and the student's first mic tap covers it either way.
function markUnlocked(){
  if(audioUnlocked) return;
  audioUnlocked = true;
  clearTapPrompt();
  document.removeEventListener('touchstart', unlockAudio);
  document.removeEventListener('click', unlockAudio);
  maybeBegin();
}
function unlockAudio(){
  // Must call play()/resume() inside the gesture handler for iOS to honour it.
  var ok = false;
  try{
    var c = getACtx();
    if(c.state === 'running'){ ok = true; }
    else c.resume().then(function(){ if(c.state === 'running') markUnlocked(); }).catch(function(){});
  }catch(e){}
  try{ $('simliAudio').play().catch(function(){}); }catch(e){}
  if(ok) markUnlocked();
}
// Listeners stay attached until sound is genuinely available, so a tap that
// fails to unlock doesn't burn the one chance to try.
document.addEventListener('touchstart', unlockAudio, { passive:true });
document.addEventListener('click', unlockAudio);

// test hook (used by the verification rig; harmless in production)
window._lab = { addBubble: addBubble };
</script>
</body>
